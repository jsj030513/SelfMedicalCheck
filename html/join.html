<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-Med | 회원가입</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <a href="./main.html" class="auth-logo" style="text-decoration: none;">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <span class="logo-text">Self-<span>Med</span></span>
    </a>

    <h2>회원가입</h2>
    <p>건강 관리를 위한 첫 걸음을 시작하세요.</p>

    <form action="./login.html" method="POST">
      <input type="text" placeholder="성함" required>
      <input type="text" placeholder="아이디" required>
      <input type="password" placeholder="비밀번호" required>
      <input type="password" placeholder="비밀번호 확인" required>
      <input type="email" placeholder="이메일 (선택)">
      <button type="submit" class="btn-primary">가입완료</button>
    </form>

    <div class="auth-footer">
      이미 계정이 있나요? <a href="./login.html">로그인</a>
    </div>
  </div>
</body>
</html>
